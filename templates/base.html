{% load static tailwind_cli %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Sistema{% endblock %}</title>
  {% tailwind_css %}
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body class="min-h-screen bg-neutral-50 text-neutral-900 antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% if user.is_authenticated %}
    <header class="border-b border-neutral-200 bg-white">
      <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3">
        <a href="/" class="font-semibold">{{ user.empresa|default:"Sistema" }}</a>
        <nav class="flex items-center gap-4 text-sm">
          <a href="{% url 'clientes:lista' %}" class="text-neutral-600 hover:text-neutral-900">Clientes</a>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="text-neutral-600 hover:text-neutral-900">Sair</button>
          </form>
        </nav>
      </div>
    </header>
  {% endif %}

  <main class="mx-auto max-w-5xl px-4 py-8">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
