{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="mx-auto mt-12 max-w-sm rounded-xl border border-neutral-200 bg-white p-6">
  <h1 class="mb-6 text-2xl font-bold">Entrar</h1>

  {% if form.non_field_errors %}
    <p class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert">
      Usuário ou senha incorretos.
    </p>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_username" class="mb-1 block text-sm font-medium">Usuário</label>
      <input id="id_username" name="username" autocomplete="username" required autofocus
             class="w-full rounded-lg border border-neutral-300 px-3 py-2">
    </div>
    <div>
      <label for="id_password" class="mb-1 block text-sm font-medium">Senha</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required
             class="w-full rounded-lg border border-neutral-300 px-3 py-2">
    </div>
    <button class="w-full rounded-lg bg-destaque px-4 py-2 font-semibold text-white hover:bg-destaque-escuro">
      Entrar
    </button>
  </form>
</div>
{% endblock %}
