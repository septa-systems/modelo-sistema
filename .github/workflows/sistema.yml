name: Sistema

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sistema:
    name: Sistema (Ruff, testes e segurança)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: sistema
          POSTGRES_USER: sistema
          POSTGRES_PASSWORD: sistema-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sistema -d sistema"
          --health-interval 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://sistema:sistema-ci@localhost:5432/sistema
      SECRET_KEY: chave-so-para-o-ci-nao-usar-em-lugar-nenhum-0123456789abcdef
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Formatação (Ruff)
        run: ruff format --check .
      - name: Erros e segurança no código (Ruff)
        run: ruff check .
      - name: Migration esquecida
        run: python manage.py makemigrations --check --dry-run
      - name: Testes (pytest)
        run: pytest
      - name: Configuração de produção (check --deploy)
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: exemplo.com.br
        run: python manage.py check --deploy --fail-level WARNING
